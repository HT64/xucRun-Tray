# Purpose: Builds and attests unsigned xucRun Tray release assets and stages unpublished releases as drafts.
# Approach: Resolves the pinned Core revision, builds and verifies Tray outputs, records the toolchain, and creates a draft release.
name: xucRun Tray Release

on:
  push:
    tags:
      - 'v*.*.*.*'

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: xucRun-Tray-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-draft-release:
    name: Build and stage release
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out tagged Tray source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: xucRun-Tray
          fetch-depth: 0

      - name: Validate release tag
        shell: powershell
        working-directory: xucRun-Tray
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v(\d+\.\d+\.\d+\.\d+)$') {
            throw "Release tag has an invalid format: $env:GITHUB_REF_NAME"
          }
          $version = $Matches[1]
          git fetch origin main --no-tags
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw 'The release tag does not point to a commit on origin/main.'
          }
          "XUCRUN_TRAY_RELEASE_VERSION=$version" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Read pinned xucRun dependency
        id: core_dependency
        shell: powershell
        working-directory: xucRun-Tray
        run: |
          $dependency = Get-Content -LiteralPath .\Dependencies.json -Raw |
            ConvertFrom-Json
          if ($dependency.schemaVersion -ne 1 -or
              $dependency.core.repository -ne 'HT64/xucRun' -or
              $dependency.core.commit -notmatch '^[0-9a-f]{40}$') {
            throw 'Dependencies.json does not contain a valid xucRun dependency.'
          }
          $utf8 = [Text.UTF8Encoding]::new($false)
          [IO.File]::AppendAllText(
            $env:GITHUB_OUTPUT,
            "repository=$($dependency.core.repository)`n",
            $utf8)
          [IO.File]::AppendAllText(
            $env:GITHUB_OUTPUT,
            "commit=$($dependency.core.commit)`n",
            $utf8)

      - name: Check out pinned xucRun
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ steps.core_dependency.outputs.repository }}
          ref: ${{ steps.core_dependency.outputs.commit }}
          path: xucRun-Core

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Verify Tray boundary
        shell: powershell
        working-directory: xucRun-Tray
        run: .\Test-TrayArchitecture.ps1

      - name: Build Release x64
        shell: powershell
        working-directory: xucRun-Tray
        run: |
          msbuild.exe .\XUCRun-Tray.sln `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /m `
            /nologo `
            /verbosity:minimal
          if ($LASTEXITCODE -ne 0) {
            throw "Tray build failed with exit code $LASTEXITCODE."
          }

      - name: Record build toolchain
        shell: powershell
        working-directory: xucRun-Tray
        run: |
          .\New-BuildToolchainReport.ps1 `
            -ProjectPath .\xucRunTray\xucRunTray.vcxproj `
            -ProductName 'xucRun Tray' `
            -DestinationPath .\artifacts\BUILD-TOOLCHAIN.txt

      - name: Create unsigned release package
        shell: powershell
        working-directory: xucRun-Tray
        run: |
          .\New-xucRunTray-Package.ps1 `
            -Configuration Release `
            -BuildToolchainReportPath .\artifacts\BUILD-TOOLCHAIN.txt

      - name: Verify release package
        shell: powershell
        working-directory: xucRun-Tray
        run: |
          .\Test-TrayAddonPackage.ps1 -Configuration Release
          $installer = ".\artifacts\Package\Release\" +
            "xucRun-Tray-$env:XUCRUN_TRAY_RELEASE_VERSION-x64.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "Release tag and built Tray version do not match: $installer"
          }

      - name: Verify tracked files are unchanged
        shell: powershell
        working-directory: xucRun-Tray
        run: |
          $changes = @(git status --porcelain=v1 --untracked-files=no)
          if ($changes.Count -ne 0) {
            throw "The release build modified tracked files.`n$($changes -join "`n")"
          }

      - name: Attest release assets
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            xucRun-Tray/artifacts/Package/Release/*.exe
            xucRun-Tray/artifacts/Package/Release/BUILD-TOOLCHAIN.txt
            xucRun-Tray/artifacts/Package/Release/LICENSE
            xucRun-Tray/artifacts/Package/Release/NOTICE
            xucRun-Tray/artifacts/Package/Release/SHA256SUMS.txt

      - name: Upload release preparation artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xucRun-Tray-${{ env.XUCRUN_TRAY_RELEASE_VERSION }}-release-assets
          path: xucRun-Tray/artifacts/Package/Release
          if-no-files-found: error
          retention-days: 30

      - name: Create or update draft GitHub Release
        shell: powershell
        working-directory: xucRun-Tray
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:XUCRUN_TRAY_RELEASE_VERSION
          $tag = $env:GITHUB_REF_NAME
          $releaseDirectory = Join-Path $PWD 'artifacts\Package\Release'
          $installerName = "xucRun-Tray-$version-x64.exe"
          $notesPath = Join-Path $releaseDirectory 'RELEASE-NOTES.md'
          .\New-xucRunTray-ReleaseNotes.ps1 `
            -Version $version `
            -ChecksumPath (Join-Path $releaseDirectory 'SHA256SUMS.txt') `
            -DestinationPath $notesPath

          $existingReleases = @(
            gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" |
              ConvertFrom-Json |
              Where-Object { $_.tag_name -eq $tag }
          )
          if ($existingReleases.Count -gt 1) {
            throw "Multiple GitHub Releases exist for tag '$tag'."
          }
          if ($existingReleases.Count -eq 1 -and -not $existingReleases[0].draft) {
            Write-Host "::notice title=Published release retained::A published GitHub Release already exists for tag '$tag'. The tagged source was built and its assets remain available only as the workflow artifact. Published assets and attestations were not replaced and may refer to an earlier commit."
            @"
          ### Published release retained

          The tagged source was built and validated. A published release already exists for tag
          $tag, so its assets, release notes, and attestations were not modified. They may
          refer to an earlier commit than the current tag. The newly built files are available
          only in the workflow artifact.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            exit 0
          }

          $releaseAssets = @(
            (Join-Path $releaseDirectory $installerName),
            (Join-Path $releaseDirectory 'BUILD-TOOLCHAIN.txt'),
            (Join-Path $releaseDirectory 'SHA256SUMS.txt'),
            (Join-Path $releaseDirectory 'LICENSE'),
            (Join-Path $releaseDirectory 'NOTICE')
          )
          if ($existingReleases.Count -eq 1) {
            gh release edit $tag `
              --title "xucRun Tray $version" `
              --notes-file $notesPath `
              --draft
            if ($LASTEXITCODE -ne 0) {
              throw "Updating the draft GitHub Release failed with exit code $LASTEXITCODE."
            }
            gh release upload $tag @releaseAssets --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "Updating draft release assets failed with exit code $LASTEXITCODE."
            }
            exit 0
          }
          gh release create $tag @releaseAssets `
            --draft `
            --verify-tag `
            --title "xucRun Tray $version" `
            --notes-file $notesPath
          if ($LASTEXITCODE -ne 0) {
            throw "Creating the draft GitHub Release failed with exit code $LASTEXITCODE."
          }
