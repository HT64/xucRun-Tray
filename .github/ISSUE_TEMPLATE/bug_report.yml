# Purpose: Structured bug report form for xucRun Tray that collects the environment and reproduction details needed for a single maintainer to investigate.
# Approach: Uses a GitHub issue form with required version and reproduction fields and routes suspected vulnerabilities to private reporting.
name: Bug report
description: Report a reproducible problem with xucRun Tray (English).
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a problem.

        **Do not report suspected security vulnerabilities here.** Use the confidential process in
        [SECURITY.md](../blob/main/SECURITY.md) (GitHub Private Vulnerability Reporting) instead.

        Problems with launching programs, credentials, approvals, or the broker service belong to
        the main [xucRun repository](https://github.com/HT64/xucRun/issues). This form is for the
        Tray status icon, its menu, and its installer.
  - type: input
    id: tray-version
    attributes:
      label: xucRun Tray version
      description: Shown in the Tray information view or the icon tooltip, for example `0.9.1.8`. xucRun Tray requires exactly the same xucRun version.
      placeholder: "0.9.1.8"
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows version
      description: Edition and build, for example `Windows 11 Pro 24H2 (26100.2605)` or `Windows 10 Pro 22H2 (19045.5131)`.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - "Status icon (color, pulsing, tooltip)"
        - "Elevated processes list or window activation"
        - "Menu actions (credentials, approvals, service, language)"
        - "Logon startup / autostart"
        - "Installer or uninstaller"
        - "Other"
    validations:
      required: true
  - type: dropdown
    id: tray-elevated
    attributes:
      label: Is the Tray process running elevated?
      description: The tooltip shows this; the icon carries a shield overlay when elevated.
      options:
        - "No"
        - "Yes"
        - "Unknown"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include which program you launched through xucRun, under which account, and whether its main window was visible.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the exact text of any message. Screenshots of the icon or menu are welcome; please mask account names you do not want to publish.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Diagnostics (optional)
      description: Relevant lines from the client log (`ClientLogDirectory` in `xucRun.ini`), the `xucRunBroker` entries in the Windows Application event log, or the output of `xucRun.exe /audit`. Remove anything you consider sensitive.
      render: text
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: This report does not describe a security vulnerability.
          required: true
        - label: I have removed passwords and other secrets from the report.
          required: true
